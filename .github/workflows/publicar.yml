# Publica en GitHub Pages con cada push a main, SOLO si pasan los tests.
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # deploy-pages necesita listar el artefacto de esta ejecución
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1) tests + empaquetar el sitio
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests (si fallan, no se publica)
        run: node reglas.test.js && node aprende.test.js && node comida.test.js && node ia.test.js && node recordatorios.test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

  # 2) publicar (en un trabajo aparte: así el artefacto ya está disponible)
  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
